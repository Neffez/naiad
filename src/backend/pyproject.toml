[project]
name = "naiad"
dynamic = ["version"]
description = "Garden irrigation controller for Home Assistant"
readme = "../../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "apscheduler>=3.10",
    "websockets>=12.0",
    "pydantic>=2.7",
    "sqlmodel>=0.0.19",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: naiad/__init__.py's __version__.
[tool.hatch.version]
path = "naiad/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["naiad"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Depends() in FastAPI default args is the correct pattern

[tool.ruff.lint.isort]
known-first-party = ["naiad"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
