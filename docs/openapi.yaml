openapi: "3.1.0"
info:
  title: Naiad API
  version: "1.0.0"
  description: Garden irrigation controller — REST API

servers:
  - url: /api

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:

    # ── Enums ────────────────────────────────────────────────────────────────

    SequenceStatus:
      type: string
      enum: [idle, running, paused, disabled]

    TriggerSource:
      type: string
      enum: [cron, manual, plan, resume, mqtt]

    AbortReason:
      type: string
      enum: [rain, wind, watchdog, manual_stop, ha_disconnect, staircase_retrigger_failed, close_failed, start_failed]

    ValveStateEnum:
      type: string
      enum: [on, off, unknown]

    # ── Valve ─────────────────────────────────────────────────────────────────

    ValveState:
      type: object
      required: [id, zone_id, label, state, on_since, runtime_min, single_run]
      properties:
        id:          { type: string }
        zone_id:     { type: string }
        label:       { type: string }
        state:       { $ref: '#/components/schemas/ValveStateEnum' }
        on_since:    { type: string, format: date-time, nullable: true }
        runtime_min: { type: number, nullable: true }
        total_min:
          type: number
          nullable: true
          description: "Planned total duration of a single-zone run, for remaining-time display. Null unless single_run is true."
        single_run:
          type: boolean
          description: "True when this zone is running as a standalone single-zone run (stoppable directly)."

    # ── Sequences ─────────────────────────────────────────────────────────────

    ZoneSummary:
      type: object
      required: [id, label, valve_state]
      properties:
        id:          { type: string }
        label:       { type: string }
        valve_state: { $ref: '#/components/schemas/ValveStateEnum' }

    CurrentRun:
      type: object
      required: [zone_id, zone_label, started_at, elapsed_min, remaining_min, total_min, triggered_by]
      properties:
        zone_id:       { type: string }
        zone_label:    { type: string }
        started_at:    { type: string, format: date-time }
        elapsed_min:   { type: number }
        remaining_min: { type: number }
        total_min:     { type: number }
        triggered_by:  { $ref: '#/components/schemas/TriggerSource' }

    ScheduleSummary:
      type: object
      required: [days, times, cron]
      properties:
        days:   { type: array, items: { type: integer }, description: "ISO weekdays 1=Mon..7=Sun; empty = every day" }
        times:  { type: array, items: { type: string }, description: "Clock times HH:MM" }
        cron:   { type: string, nullable: true, description: "Advanced cron override; set only when active" }

    SequenceState:
      type: object
      required: [id, label, status, enabled, paused, factor_pct, factor_notes, schedule, next_run_at, zones, basis_min_per_zone, current_run]
      properties:
        id:                 { type: string }
        label:              { type: string }
        status:             { $ref: '#/components/schemas/SequenceStatus' }
        enabled:            { type: boolean }
        paused:             { type: boolean }
        factor_pct:         { type: integer }
        factor_notes:       { $ref: '#/components/schemas/FactorNotes' }
        schedule:           { $ref: '#/components/schemas/ScheduleSummary' }
        next_run_at:        { type: string, format: date-time, nullable: true }
        zones:
          type: array
          items: { $ref: '#/components/schemas/ZoneSummary' }
        basis_min_per_zone: { type: integer }
        current_run:
          nullable: true
          oneOf:
            - { $ref: '#/components/schemas/CurrentRun' }
            - { type: 'null' }

    StartSequenceRequest:
      type: object
      properties:
        duration_min:
          type: integer
          nullable: true
          description: "Override in minutes. null = use config default with factor applied."

    StartZoneRequest:
      type: object
      required: [duration_min]
      properties:
        duration_min:
          type: integer
          minimum: 1
          description: "Run duration in minutes for this single zone (factor not applied)."

    # ── Status ────────────────────────────────────────────────────────────────

    WeatherSummary:
      type: object
      required: [temp_c, rain_24h_mm, wind_label, season_active]
      properties:
        temp_c:        { type: number, nullable: true }
        rain_24h_mm:   { type: number }
        wind_label:    { type: string }
        season_active: { type: boolean }

    FactorNotes:
      type: object
      description: Structured (machine-readable) reasons behind a sequence's factor; the frontend localizes them.
      required: [season_off, wind_blocked, rain_factor_pct, temp_delta_pct]
      properties:
        season_off:      { type: boolean }
        wind_blocked:    { type: boolean }
        rain_factor_pct: { type: integer, nullable: true, description: "Rain multiplier in % (100 = neutral); set only when rain reduces watering." }
        temp_delta_pct:  { type: integer, nullable: true, description: "Signed temperature delta in %; set only when |delta| >= 5." }

    FactorBreakdown:
      type: object
      required: [temp_pct, rain_pct, combined_pct, manual, wind_blocking_sequences, temp_input_c, rain_prob_pct, rain_mm]
      properties:
        temp_pct:                 { type: integer, description: "Signed temperature delta in % (0 = neutral)." }
        rain_pct:                 { type: integer, description: "Signed rain delta in % (0 = neutral)." }
        combined_pct:             { type: integer, description: "Overall factor in % (100 = neutral)." }
        manual:                   { type: boolean, description: "True when combined_pct is a manual override (temp/rain deltas are neutral)." }
        wind_blocking_sequences:
          type: array
          items: { type: string }
        temp_input_c:              { type: number, nullable: true }
        rain_prob_pct:             { type: number, nullable: true }
        rain_mm:                   { type: number, nullable: true }

    NextRunSummary:
      type: object
      required: [sequence_id, sequence_label, scheduled_at, duration_min, plan_id]
      properties:
        sequence_id:    { type: string }
        sequence_label: { type: string }
        scheduled_at:   { type: string, format: date-time }
        duration_min:   { type: integer }
        plan_id:
          type: string
          nullable: true
          description: Set for one-off planned runs; null for recurring cron runs.

    SystemStatus:
      type: object
      required: [master_on, ha_connected, weather, today_factor, next_run, after_next, upcoming_runs, liters_today, liters_week, week_series]
      properties:
        master_on:    { type: boolean }
        ha_connected: { type: boolean }
        weather:      { $ref: '#/components/schemas/WeatherSummary' }
        today_factor: { $ref: '#/components/schemas/FactorBreakdown' }
        next_run:
          nullable: true
          oneOf:
            - { $ref: '#/components/schemas/NextRunSummary' }
            - { type: 'null' }
        after_next:
          nullable: true
          oneOf:
            - { $ref: '#/components/schemas/NextRunSummary' }
            - { type: 'null' }
        upcoming_runs:
          type: array
          items: { $ref: '#/components/schemas/NextRunSummary' }
          description: >-
            All upcoming runs of the next day that has any — today if runs remain
            today, otherwise the next day with scheduled runs.
        liters_today: { type: number }
        liters_week:  { type: number }
        week_series:
          type: array
          items: { type: number }
          description: Liters per local weekday Mon..Sun of the current week

    # ── Plans ─────────────────────────────────────────────────────────────────

    Plan:
      type: object
      required: [id, target_type, sequence_id, sequence_label, zone_id, zone_label, label, scheduled_at, duration_min, estimated_liters, created_at]
      properties:
        id:               { type: string, format: uuid }
        target_type:
          type: string
          enum: [sequence, zone]
        sequence_id:      { type: string, nullable: true }
        sequence_label:   { type: string, nullable: true }
        zone_id:          { type: string, nullable: true }
        zone_label:       { type: string, nullable: true }
        label:            { type: string, description: "Unified display label (sequence or zone)." }
        scheduled_at:     { type: string, format: date-time }
        duration_min:     { type: integer, nullable: true }
        estimated_liters: { type: number, nullable: true }
        created_at:       { type: string, format: date-time }

    CreatePlanRequest:
      type: object
      required: [mode, value]
      description: >-
        Provide exactly one of sequence_id or zone_id. A zone plan additionally
        requires duration_min (there is no per-zone default).
      properties:
        sequence_id:  { type: string, nullable: true }
        zone_id:      { type: string, nullable: true }
        mode:
          type: string
          enum: [in_hours, at_datetime]
        value:
          description: "Hours from now (in_hours) or ISO 8601 datetime string (at_datetime)"
          oneOf:
            - { type: number }
            - { type: string }
        duration_min:
          type: integer
          nullable: true
          description: "Sequence plan: null = use config default. Zone plan: required."

    # ── History ───────────────────────────────────────────────────────────────

    HistoryEntry:
      type: object
      required: [id, zone_id, zone_label, sequence_id, sequence_label, started_at, ended_at, duration_min, liters, triggered_by, aborted, abort_reason]
      properties:
        id:             { type: integer }
        zone_id:        { type: string }
        zone_label:     { type: string }
        sequence_id:    { type: string }
        sequence_label: { type: string }
        started_at:     { type: string, format: date-time }
        ended_at:       { type: string, format: date-time, nullable: true }
        duration_min:   { type: number, nullable: true }
        liters:         { type: number, nullable: true }
        triggered_by:   { $ref: '#/components/schemas/TriggerSource' }
        aborted:        { type: boolean }
        abort_reason:
          nullable: true
          oneOf:
            - { $ref: '#/components/schemas/AbortReason' }
            - { type: 'null' }

    PaginatedHistory:
      type: object
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HistoryEntry' }
        total:    { type: integer }
        page:     { type: integer }
        per_page: { type: integer }

    DeleteHistoryResult:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer }  # number of run-history rows removed

    HistorySummary:
      type: object
      required: [days, liters, runs, avg_duration_min]
      properties:
        days:   { type: integer }
        liters: { type: number }
        runs:   { type: integer }
        avg_duration_min:
          type: number
          nullable: true
          description: Average over finished runs only; null when the window has no finished run.

    DecisionReason:
      type: string
      description: Why an automatic start was skipped.
      enum: [disabled, user_skipped, paused, master_off, wind, season_off, frost, cistern_low, zero_factor, expired]

    DecisionEntry:
      type: object
      description: >
        One automatic start decision (cron/plan/MQTT) with the factor inputs that
        produced it. Input fields are null when the decision was made before the
        sensors were read (e.g. master off).
      required: [id, created_at, sequence_id, sequence_label, triggered_by, decision, reason, factor_pct, temp_delta_pct, rain_factor_pct, temp_c, rain_today_mm, rain_tomorrow_mm, rain_prob_today_pct, rain_prob_tomorrow_pct, rain_credit_mm, rain_mode, manual_factor]
      properties:
        id:             { type: integer }
        created_at:     { type: string, format: date-time }
        sequence_id:    { type: string }
        sequence_label: { type: string }
        triggered_by:   { $ref: '#/components/schemas/TriggerSource' }
        decision:
          type: string
          enum: [started, skipped]
        reason:
          nullable: true
          description: Null for started decisions.
          oneOf:
            - { $ref: '#/components/schemas/DecisionReason' }
            - { type: 'null' }
        factor_pct:      { type: number, nullable: true, description: "Resulting combined factor in % (100 = neutral)." }
        temp_delta_pct:  { type: number, nullable: true, description: "Signed temperature contribution in % (0 = neutral)." }
        rain_factor_pct: { type: number, nullable: true, description: "Rain multiplier in % (100 = neutral)." }
        temp_c:          { type: number, nullable: true, description: "Temperature the factor used (forecast daily max, falling back to the current reading)." }
        rain_today_mm:        { type: number, nullable: true }
        rain_tomorrow_mm:     { type: number, nullable: true }
        rain_prob_today_pct:  { type: number, nullable: true }
        rain_prob_tomorrow_pct: { type: number, nullable: true }
        rain_credit_mm:  { type: number, nullable: true, description: "The rain credit the factor used: the decayed actual-rain credit (water_balance mode) or the ET₀ soil balance (et0 mode)." }
        rain_mode:
          type: string
          nullable: true
          enum: [forecast, water_balance, et0, null]
        manual_factor:   { type: boolean, description: "True when factor_pct came from the manual adjustment override." }

    PaginatedDecisions:
      type: object
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DecisionEntry' }
        total:    { type: integer }
        page:     { type: integer }
        per_page: { type: integer }

    # ── Settings ──────────────────────────────────────────────────────────────

    TempFactorSettings:
      type: object
      required: [basis_c, pct_per_c, min_pct, max_pct]
      properties:
        basis_c:    { type: number }
        pct_per_c:  { type: number }
        min_pct:    { type: integer }
        max_pct:    { type: integer }

    RainFactorSettings:
      type: object
      required: [mode, forecast_days, threshold_prob, reduce_above_mm, zero_above_mm, forecast_decay, water_balance_days, water_balance_decay, et0_reservoir_mm, peak_tomorrow, confirm_with_rain_sensor]
      properties:
        mode:
          type: string
          enum: [forecast, water_balance, et0]
        forecast_days:     { type: integer, description: "Forecast window in days: 1 = today only, 2 = today + tomorrow (values above 2 behave like 2)." }
        threshold_prob:    { type: integer }
        reduce_above_mm:   { type: number }
        zero_above_mm:     { type: number }
        forecast_decay:    { type: number }
        water_balance_days: { type: integer, description: "Recent actual-rain history window for water_balance mode." }
        water_balance_decay: { type: number, description: "Daily carryover for actual rain in water_balance mode (and the per-day fallback in et0 mode when no ET₀ data is available)." }
        et0_reservoir_mm: { type: number, description: "et0 mode: soil reservoir capacity in mm of plant-available water. Rain fills the ET₀ balance up to this cap; daily ET₀ drains it." }
        peak_tomorrow:     { type: boolean, description: "When true the rain factor also uses tomorrow's daily peak forecast, not just the latest reading. Today always uses the peak." }
        confirm_with_rain_sensor: { type: boolean, description: "When true today's forecast peak only applies up to the level that coincided with the binary rain sensor actually detecting rain. In water_balance mode, actual-rain deltas also only count while the rain sensor was on." }

    SequenceOverride:
      type: object
      required: [basis_min_per_zone, watchdog_min, paused]
      properties:
        basis_min_per_zone: { type: integer, nullable: true }
        watchdog_min:       { type: integer, nullable: true }
        paused:             { type: boolean }

    TempFactorSettingsUpdate:
      type: object
      properties:
        basis_c:    { type: number }
        pct_per_c:  { type: number }
        min_pct:    { type: integer }
        max_pct:    { type: integer }

    RainFactorSettingsUpdate:
      type: object
      properties:
        mode:
          type: string
          enum: [forecast, water_balance, et0]
        forecast_days:     { type: integer, description: "Forecast window in days: 1 = today only, 2 = today + tomorrow (values above 2 behave like 2)." }
        threshold_prob:    { type: integer }
        reduce_above_mm:   { type: number }
        zero_above_mm:     { type: number }
        forecast_decay:    { type: number }
        water_balance_days: { type: integer, description: "Recent actual-rain history window for water_balance mode." }
        water_balance_decay: { type: number, description: "Daily carryover for actual rain in water_balance mode (and the per-day fallback in et0 mode when no ET₀ data is available)." }
        et0_reservoir_mm: { type: number, description: "et0 mode: soil reservoir capacity in mm of plant-available water. Rain fills the ET₀ balance up to this cap; daily ET₀ drains it." }
        peak_tomorrow:     { type: boolean, description: "When true the rain factor also uses tomorrow's daily peak forecast, not just the latest reading. Today always uses the peak." }
        confirm_with_rain_sensor: { type: boolean, description: "When true today's forecast peak only applies up to the level that coincided with the binary rain sensor actually detecting rain. In water_balance mode, actual-rain deltas also only count while the rain sensor was on." }

    SequenceOverrideUpdate:
      type: object
      properties:
        basis_min_per_zone: { type: integer, nullable: true }
        watchdog_min:       { type: integer, nullable: true }
        paused:             { type: boolean }

    FactorSettingsUpdate:
      type: object
      properties:
        temp: { $ref: '#/components/schemas/TempFactorSettingsUpdate' }
        rain: { $ref: '#/components/schemas/RainFactorSettingsUpdate' }
        manual_mode: { type: boolean, description: "When true, the manual adjustment overrides the automatic factor." }
        manual_pct:  { type: integer, nullable: true, description: "Manual adjustment percentage (clamped to the temperature factor's min/max)." }

    UpdateSettingsRequest:
      type: object
      properties:
        sequences:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SequenceOverrideUpdate' }
        factors: { $ref: '#/components/schemas/FactorSettingsUpdate' }
        token_lifetime_days:  { type: integer, minimum: 1, maximum: 365 }
        auto_login_enabled:   { type: boolean }

    AppSettings:
      type: object
      required: [sequences, factors, token_lifetime_days, auto_login_enabled]
      properties:
        sequences:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SequenceOverride' }
        factors:
          type: object
          required: [temp, rain, manual_mode, manual_pct, temp_overridden, rain_overridden]
          properties:
            temp: { $ref: '#/components/schemas/TempFactorSettings' }
            rain: { $ref: '#/components/schemas/RainFactorSettings' }
            manual_mode: { type: boolean, description: "When true, the manual adjustment overrides the automatic factor." }
            manual_pct:  { type: integer, nullable: true, description: "Manual adjustment percentage (clamped to the temperature factor's min/max)." }
            temp_overridden: { type: boolean, description: "True when any temperature factor value is overridden in the DB (differs from the configured base)." }
            rain_overridden: { type: boolean, description: "True when any rain factor value is overridden in the DB (differs from the configured base)." }
        token_lifetime_days:  { type: integer }
        auto_login_enabled:   { type: boolean }

    UserPreferences:
      type: object
      required: [sequence_order, zone_order]
      properties:
        sequence_order:
          type: array
          description: Sequence IDs in the user's preferred dashboard order. IDs not present are appended in their natural order.
          items: { type: string }
        zone_order:
          type: array
          description: Zone IDs in the user's preferred dashboard order. IDs not present are appended in their natural order.
          items: { type: string }

    UpdatePreferencesRequest:
      type: object
      properties:
        sequence_order:
          type: array
          items: { type: string }
        zone_order:
          type: array
          items: { type: string }

    # ── Configuration ────────────────────────────────────────────────────────

    NotificationCategory:
      type: string
      enum: [start, skip, abort, reminder]

    NotifyTarget:
      type: object
      required: [service, categories, quiet, platform]
      properties:
        service: { type: string }
        categories:
          type: array
          items: { $ref: '#/components/schemas/NotificationCategory' }
        quiet: { type: boolean }
        platform:
          type: string
          enum: [auto, ios, android]

    HAConfigPublic:
      type: object
      required: [url, notify_targets]
      properties:
        url: { type: string }
        notify_targets:
          type: array
          items: { $ref: '#/components/schemas/NotifyTarget' }

    MQTTConfig:
      type: object
      required: [enabled, host, port, username, client_id, discovery_prefix, base_topic, password_set]
      properties:
        enabled: { type: boolean }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        client_id: { type: string }
        discovery_prefix: { type: string }
        base_topic: { type: string }
        password_set:
          type: boolean
          description: Whether an environment-managed MQTT password is configured. The password value is never exposed.

    MQTTConfigInput:
      type: object
      required: [enabled, host, port, username, client_id, discovery_prefix, base_topic]
      properties:
        enabled: { type: boolean }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        client_id: { type: string }
        discovery_prefix: { type: string }
        base_topic: { type: string }
        password_set:
          type: boolean
          description: Accepted for GET→edit→PUT round-trips and ignored by the backend.

    AutoLoginTrigger:
      type: object
      required: [url_param, trusted_referers, trusted_ips]
      properties:
        url_param: { type: string }
        trusted_referers:
          type: array
          items: { type: string }
        trusted_ips:
          type: array
          items: { type: string }

    AutoLoginConfig:
      type: object
      required: [enabled, trigger]
      properties:
        enabled: { type: boolean }
        trigger: { $ref: '#/components/schemas/AutoLoginTrigger' }

    ForwardHeaderConfig:
      type: object
      required: [header, trusted_proxies]
      properties:
        header: { type: string }
        trusted_proxies:
          type: array
          items: { type: string }

    AuthConfig:
      type: object
      required: [mode, forward_header, auto_login, frame_ancestors, password_set]
      properties:
        mode:
          type: string
          enum: [password, forward_header, none]
        forward_header: { $ref: '#/components/schemas/ForwardHeaderConfig' }
        auto_login: { $ref: '#/components/schemas/AutoLoginConfig' }
        frame_ancestors:
          type: array
          items: { type: string }
        password_set:
          type: boolean
          description: Whether an environment-managed password is configured. The password value is never exposed.

    AuthConfigInput:
      type: object
      required: [mode, forward_header, auto_login, frame_ancestors]
      properties:
        mode:
          type: string
          enum: [password, forward_header, none]
        forward_header: { $ref: '#/components/schemas/ForwardHeaderConfig' }
        auto_login: { $ref: '#/components/schemas/AutoLoginConfig' }
        frame_ancestors:
          type: array
          items: { type: string }
        password_set:
          type: boolean
          description: Accepted for GET→edit→PUT round-trips and ignored by the backend.

    SensorsConfig:
      type: object
      required: [rain, wind, season, temperature, temperature_max, precipitation_prob_today, precipitation_prob_tomorrow, precipitation_today, precipitation_tomorrow, precipitation_actual, et0]
      properties:
        rain: { type: string }
        wind: { type: string }
        season: { type: string }
        temperature: { type: string }
        temperature_max: { type: string }
        precipitation_prob_today: { type: string }
        precipitation_prob_tomorrow: { type: string }
        precipitation_today: { type: string }
        precipitation_tomorrow: { type: string }
        precipitation_actual: { type: string }
        et0: { type: string, description: "Optional daily reference evapotranspiration (ET₀) sensor in mm/day. Used by the et0 rain mode; when empty, ET₀ is computed internally (Hargreaves) from the temperature sensor's history and the HA latitude." }

    WindConfig:
      type: object
      required: [abort_after_min]
      properties:
        abort_after_min:
          type: number
          minimum: 0
          description: >-
            Minutes the wind alarm must be sustained before a running
            wind-blocked sequence is aborted. The effective delay per run is
            min(abort_after_min, 10% of the run's planned duration); the alarm
            clearing earlier cancels the abort. 0 aborts immediately.

    FrostConfig:
      type: object
      required: [enabled, temperature_min, threshold_c]
      properties:
        enabled: { type: boolean }
        temperature_min:
          type: string
          description: >-
            Forecast daily-minimum temperature sensor. Required when the
            lockout is enabled.
        threshold_c:
          type: number
          description: >-
            Automatic starts are skipped while the forecast daily minimum is
            below this temperature (°C).

    CisternConfig:
      type: object
      required: [enabled, level_entity, min_level]
      properties:
        enabled: { type: boolean }
        level_entity:
          type: string
          description: >-
            Numeric cistern level sensor. Required when the guard is enabled.
        min_level:
          type: number
          description: >-
            Automatic starts are skipped while the level is below this value
            (same unit as the sensor reports, e.g. % or cm).

    ZoneConfig:
      type: object
      required: [label, switch, flow_lph, staircase_enabled, staircase_min]
      properties:
        label: { type: string }
        switch: { type: string }
        flow_lph: { type: number, minimum: 0, description: "Liters per hour, used to derive recorded liters from run duration. 0 = no liter tracking for this zone." }
        staircase_enabled: { type: boolean }
        staircase_min: { type: number }

    SequenceColorKey:
      type: string
      enum: [green, sand, purple, slate, blue, rose]

    SequenceConfig:
      type: object
      required: [label, zones, basis_min_per_zone, range, watchdog_min, schedule, enabled, wind_blocks, color]
      properties:
        label: { type: string }
        zones:
          type: array
          items: { type: string }
        basis_min_per_zone: { type: number, exclusiveMinimum: 0 }
        range:
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
            - { type: number }
            - { type: number }
        watchdog_min: { type: integer, exclusiveMinimum: 0 }
        schedule: { $ref: '#/components/schemas/ScheduleSummary' }
        enabled: { type: boolean }
        wind_blocks: { type: boolean }
        color:
          nullable: true
          oneOf:
            - { $ref: '#/components/schemas/SequenceColorKey' }
            - { type: 'null' }

    TempFactorConfig:
      type: object
      required: [formula, basis_c, pct_per_c, min_pct, max_pct]
      properties:
        formula:
          type: string
          enum: [linear]
        basis_c: { type: number }
        pct_per_c: { type: number }
        min_pct: { type: integer, minimum: 0 }
        max_pct: { type: integer, minimum: 0 }

    RainFactorConfig:
      type: object
      required: [mode, forecast_days, threshold_prob, reduce_above_mm, zero_above_mm, forecast_decay, water_balance_days, water_balance_decay, et0_reservoir_mm, peak_tomorrow, confirm_with_rain_sensor]
      properties:
        mode:
          type: string
          enum: [forecast, water_balance, et0]
        forecast_days: { type: integer, minimum: 1, description: "Forecast window in days: 1 = today only, 2 = today + tomorrow (values above 2 behave like 2)." }
        threshold_prob: { type: integer, minimum: 0, maximum: 100 }
        reduce_above_mm: { type: number }
        zero_above_mm: { type: number }
        forecast_decay: { type: number, minimum: 0, maximum: 1 }
        water_balance_days: { type: integer, minimum: 1, maximum: 14 }
        water_balance_decay: { type: number, minimum: 0, maximum: 1 }
        et0_reservoir_mm: { type: number, exclusiveMinimum: 0, description: "et0 mode: soil reservoir capacity in mm of plant-available water." }
        peak_tomorrow: { type: boolean }
        confirm_with_rain_sensor: { type: boolean }

    FactorsConfig:
      type: object
      required: [temp, rain]
      properties:
        temp: { $ref: '#/components/schemas/TempFactorConfig' }
        rain: { $ref: '#/components/schemas/RainFactorConfig' }

    NotificationsConfig:
      type: object
      required: [evening_reminder_cron, queue_max_hours]
      properties:
        evening_reminder_cron: { type: string }
        queue_max_hours: { type: number, minimum: 0 }

    ConfigDoc:
      type: object
      required: [ha, mqtt, auth, sensors, wind, frost, cistern, zones, sequences, factors, notifications, water_price_per_m3, timezone, sequence_colors_enabled, restart_required]
      properties:
        ha: { $ref: '#/components/schemas/HAConfigPublic' }
        mqtt: { $ref: '#/components/schemas/MQTTConfig' }
        auth: { $ref: '#/components/schemas/AuthConfig' }
        sensors: { $ref: '#/components/schemas/SensorsConfig' }
        wind: { $ref: '#/components/schemas/WindConfig' }
        frost: { $ref: '#/components/schemas/FrostConfig' }
        cistern: { $ref: '#/components/schemas/CisternConfig' }
        zones:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ZoneConfig' }
        sequences:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SequenceConfig' }
        factors: { $ref: '#/components/schemas/FactorsConfig' }
        notifications: { $ref: '#/components/schemas/NotificationsConfig' }
        water_price_per_m3:
          type: number
          minimum: 0
          description: Water price per cubic meter (e.g. EUR/m³); 0 hides cost display.
        timezone: { type: string }
        sequence_colors_enabled: { type: boolean }
        restart_required: { type: boolean }

    ConfigUpdateRequest:
      type: object
      required: [ha, mqtt, auth, sensors, zones, sequences, factors, notifications, timezone, sequence_colors_enabled]
      properties:
        ha: { $ref: '#/components/schemas/HAConfigPublic' }
        mqtt: { $ref: '#/components/schemas/MQTTConfigInput' }
        auth: { $ref: '#/components/schemas/AuthConfigInput' }
        sensors: { $ref: '#/components/schemas/SensorsConfig' }
        wind: { $ref: '#/components/schemas/WindConfig' }
        frost: { $ref: '#/components/schemas/FrostConfig' }
        cistern: { $ref: '#/components/schemas/CisternConfig' }
        zones:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ZoneConfig' }
        sequences:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SequenceConfig' }
        factors: { $ref: '#/components/schemas/FactorsConfig' }
        notifications: { $ref: '#/components/schemas/NotificationsConfig' }
        water_price_per_m3:
          type: number
          minimum: 0
          description: Water price per cubic meter (e.g. EUR/m³); 0 hides cost display.
        timezone: { type: string }
        sequence_colors_enabled: { type: boolean }
        restart_required:
          type: boolean
          description: Accepted for GET→edit→PUT round-trips and ignored by the backend.

    EntityInfo:
      type: object
      required: [entity_id, friendly_name, state, domain]
      properties:
        entity_id: { type: string }
        friendly_name: { type: string, nullable: true }
        state: { type: string }
        domain: { type: string }

    EntitiesResponse:
      type: object
      required: [entities]
      properties:
        entities:
          type: array
          items: { $ref: '#/components/schemas/EntityInfo' }

    ServicesResponse:
      type: object
      required: [services]
      properties:
        services:
          type: array
          items: { type: string }

    TestNotifyResponse:
      type: object
      required: [sent, targets]
      properties:
        sent: { type: integer }
        targets:
          type: array
          items: { type: string }

    # ── Auth ──────────────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [password]
      properties:
        password:     { type: string }
        device_label: { type: string, description: "Optional label shown in token list" }

    LoginResponse:
      type: object
      required: [token, expires_at]
      properties:
        token:      { type: string }
        expires_at: { type: string, format: date-time }

    AuthToken:
      type: object
      required: [token_prefix, created_at, expires_at]
      properties:
        token_prefix: { type: string, description: "First 8 chars, for identification only" }
        device_label: { type: string, nullable: true }
        created_at:   { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at:   { type: string, format: date-time }

    # ── Errors ────────────────────────────────────────────────────────────────

    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }

# ── Paths ─────────────────────────────────────────────────────────────────────

paths:

  /health:
    get:
      operationId: getHealth
      summary: Health check (no auth required)
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:       { type: string, enum: [ok] }
                  ha_connected: { type: boolean }
                  version:      { type: string }

  # ── Auth ────────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      operationId: login
      summary: Authenticate with password, receive Bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/auto-login:
    post:
      operationId: autoLogin
      summary: Auto-login for trusted embedding contexts (?embed=1)
      security: []
      description: |
        Issues a token when all configured trigger conditions match:
        Referer in trusted_referers AND (optionally) client IP in trusted_ips.
        The client must assert that ?embed=1 was present in the URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [embed_param_present]
              properties:
                embed_param_present: { type: boolean }
                device_label:        { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '403':
          description: Trigger conditions not met
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/verify:
    get:
      operationId: verifyToken
      summary: Check if current Bearer token is valid
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '401':
          description: Token invalid or expired

  /auth/tokens:
    get:
      operationId: listTokens
      summary: List all active tokens
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuthToken' }

  /auth/tokens/{token_prefix}:
    delete:
      operationId: revokeToken
      summary: Revoke a token by its prefix
      parameters:
        - name: token_prefix
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Token revoked }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Status ──────────────────────────────────────────────────────────────────

  /status:
    get:
      operationId: getStatus
      summary: Full system status snapshot
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }

  /status/master:
    patch:
      operationId: setMaster
      summary: Toggle master switch on/off
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on: { type: boolean }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  master_on: { type: boolean }

  /status/skip-run:
    post:
      operationId: skipRun
      summary: Skip a single upcoming run
      description: >-
        Suppresses one scheduled occurrence. A one-off plan is deleted; a
        recurring cron occurrence is recorded as skipped so only that fire is
        suppressed and the next scheduled run happens as usual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sequence_id, scheduled_at]
              properties:
                sequence_id:  { type: string }
                scheduled_at: { type: string, format: date-time }
                plan_id:      { type: string, nullable: true }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  skipped: { type: string }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Sequences ───────────────────────────────────────────────────────────────

  /sequences:
    get:
      operationId: listSequences
      summary: List all sequences with current state
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SequenceState' }

  /sequences/{sequence_id}:
    get:
      operationId: getSequence
      summary: Get a single sequence
      parameters:
        - name: sequence_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SequenceState' }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sequences/{sequence_id}/start:
    post:
      operationId: startSequence
      summary: Start a sequence — resumes from snapshot if one exists, otherwise fresh start
      parameters:
        - name: sequence_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartSequenceRequest' }
      responses:
        '202': { description: Start accepted }
        '409':
          description: Mutex conflict — another sequence is already running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Sequence is disabled or master switch is off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sequences/{sequence_id}/pause:
    post:
      operationId: pauseSequence
      summary: Pause a running sequence — writes resume_snapshot with remaining_min
      parameters:
        - name: sequence_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '202': { description: Pause accepted }
        '409':
          description: Sequence is not currently running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sequences/{sequence_id}/stop:
    post:
      operationId: stopSequence
      summary: Abort a running sequence — no snapshot, no resume
      parameters:
        - name: sequence_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '202': { description: Stop accepted }
        '409':
          description: Sequence is not currently running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Zones (standalone single-zone runs) ──────────────────────────────────────

  /zones/{zone_id}/start:
    post:
      operationId: startZone
      summary: Start a single zone immediately (in isolation, factor not applied)
      parameters:
        - name: zone_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartZoneRequest' }
      responses:
        '202': { description: Start accepted }
        '404':
          description: Zone not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Mutex conflict — a sequence or zone is already running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Zone has no switch entity or master switch is off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /zones/{zone_id}/stop:
    post:
      operationId: stopZone
      summary: Stop a standalone single-zone run
      parameters:
        - name: zone_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '202': { description: Stop accepted }
        '409':
          description: Zone is not running as a standalone run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Valves ──────────────────────────────────────────────────────────────────

  /valves:
    get:
      operationId: listValves
      summary: Live state of all configured valves
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ValveState' }

  # ── Plans ───────────────────────────────────────────────────────────────────

  /plans:
    get:
      operationId: listPlans
      summary: List all pending scheduled runs
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Plan' }
    post:
      operationId: createPlan
      summary: Schedule a future run
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlanRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '422':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /plans/upcoming:
    get:
      operationId: listUpcomingRuns
      summary: All upcoming runs of the next N days (plans + cron schedules merged)
      description: >-
        Merges one-off plans and recurring cron schedules, sorted by fire time;
        user-skipped cron occurrences are excluded. Backs the planner's calendar
        week view.
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 14, default: 7 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NextRunSummary' }

  /plans/{plan_id}:
    delete:
      operationId: deletePlan
      summary: Cancel a scheduled plan
      parameters:
        - name: plan_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Plan deleted }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── History ─────────────────────────────────────────────────────────────────

  /history:
    get:
      operationId: getHistory
      summary: Paginated run history
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: sequence_id
          in: query
          schema: { type: string }
        - name: zone_id
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedHistory' }
    delete:
      operationId: deleteHistory
      summary: Delete run history and decision log (settings and plans are never affected)
      parameters:
        - name: older_than_days
          in: query
          description: When set, only entries older than this many days are deleted; otherwise all history is cleared.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteHistoryResult' }

  /history/decisions:
    get:
      operationId: getDecisions
      summary: Paginated decision log (why each automatic run started or was skipped)
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: sequence_id
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedDecisions' }

  /history/summary:
    get:
      operationId: getHistorySummary
      summary: Aggregate liters/runs/average duration over the last N local calendar days
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 7, minimum: 1, maximum: 365 }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistorySummary' }

  # ── Settings ────────────────────────────────────────────────────────────────

  /settings:
    get:
      operationId: getSettings
      summary: Effective settings (YAML defaults merged with DB overrides)
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppSettings' }
    patch:
      operationId: updateSettings
      summary: Update settings (partial — only provided fields are overwritten)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSettingsRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppSettings' }

  /settings/factors:
    delete:
      operationId: clearFactorOverrides
      summary: Reset factor overrides to the configured base values
      parameters:
        - name: group
          in: query
          required: false
          description: Limit the reset to one factor group; omit to reset both.
          schema: { type: string, enum: [temp, rain] }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppSettings' }

  /settings/sequences:
    delete:
      operationId: clearAllSequenceOverrides
      summary: Remove all sequence overrides (restore YAML defaults for every sequence)
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppSettings' }

  /settings/sequences/{sequence_id}:
    delete:
      operationId: clearSequenceOverride
      summary: Remove the override for a single sequence (restore its YAML defaults)
      parameters:
        - name: sequence_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppSettings' }
        '404':
          description: Unknown sequence

  # ── User preferences ────────────────────────────────────────────────────────

  /preferences:
    get:
      operationId: getPreferences
      summary: Get user preferences (theme, language) — global, not per-token
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
    patch:
      operationId: updatePreferences
      summary: Update user preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePreferencesRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }

  # ── Configuration ──────────────────────────────────────────────────────────

  /config:
    get:
      operationId: getConfiguration
      summary: Public configuration document with secrets redacted
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigDoc' }
    put:
      operationId: replaceConfiguration
      summary: Replace the configuration document
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigDoc' }
        '409':
          description: Cannot change configuration while valve operations are active
        '422':
          description: Invalid configuration

  /config/export:
    get:
      operationId: exportConfiguration
      summary: Export the effective configuration as YAML
      responses:
        '200':
          content:
            application/x-yaml:
              schema: { type: string }

  /config/import:
    post:
      operationId: importConfiguration
      summary: Import a YAML or JSON configuration document
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema: { type: string }
          application/json:
            schema: { type: object }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigDoc' }
        '400':
          description: Uploaded config could not be parsed
        '409':
          description: Cannot change configuration while valve operations are active
        '422':
          description: Invalid configuration

  /config/entities:
    get:
      operationId: listEntities
      summary: List cached Home Assistant entities for UI pickers
      parameters:
        - name: domain
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitiesResponse' }

  /config/services:
    get:
      operationId: listServices
      summary: List Home Assistant services for UI pickers
      parameters:
        - name: domain
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicesResponse' }

  /config/test-notify:
    post:
      operationId: testNotify
      summary: Send a test notification to configured notify targets
      parameters:
        - name: service
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestNotifyResponse' }
        '400':
          description: No notify targets configured
        '404':
          description: Notify target not found
        '502':
          description: Notification delivery failed
