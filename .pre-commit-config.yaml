repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
        files: ^src/backend/
      - id: ruff-format
        files: ^src/backend/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^src/backend/naiad/
        additional_dependencies: [types-pyyaml, pydantic>=2.7, sqlmodel>=0.0.19]
        args: [--ignore-missing-imports]
