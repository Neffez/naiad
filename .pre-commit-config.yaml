# All hooks run the tool versions pinned in the lockfiles (src/backend/uv.lock,
# src/frontend/package-lock.json) — the same versions CI uses. Remote hook repos
# with their own `rev:` drifted far behind CI (ruff 0.4 vs 0.17) and let commits
# through that CI's `ruff format --check` then rejected.
# Prerequisites: `uv sync --extra dev` in src/backend, `npm ci` in src/frontend.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (backend)
        entry: bash -c 'cd src/backend && uv run --frozen ruff check --fix .'
        language: system
        files: ^src/backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format (backend)
        entry: bash -c 'cd src/backend && uv run --frozen ruff format .'
        language: system
        files: ^src/backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd src/backend && uv run --frozen mypy naiad'
        language: system
        files: ^src/backend/naiad/.*\.py$
        pass_filenames: false
      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd src/frontend && npm run --silent lint'
        language: system
        files: ^src/frontend/.*\.(ts|tsx)$
        pass_filenames: false
      - id: tsc
        name: tsc --noEmit (frontend)
        entry: bash -c 'cd src/frontend && npx tsc -b'
        language: system
        files: ^src/frontend/.*\.(ts|tsx)$
        pass_filenames: false
