name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from tag
        # The git tag is the single source of truth for the app version. Bake it
        # into the package before the image build (the Docker context has no .git),
        # so the Settings UI / OpenAPI report the released version automatically.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = .*/__version__ = \"${VERSION}\"/" src/backend/naiad/__init__.py
          echo "Stamped __version__ = ${VERSION}"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Keep the Home Assistant add-on (separate repo) in lockstep with the app: when
  # naiad is tagged vX.Y.Z, bump the add-on's config.yaml version so the Supervisor
  # offers an update and rebuilds against the new :latest image.
  #
  # Requires a repo secret APP_NAIAD_TOKEN: a (fine-grained) PAT with
  # contents:write on Neffez/app-naiad. Without it this job is a no-op.
  bump-addon-version:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Bump add-on version (app-naiad)
        env:
          TOKEN: ${{ secrets.APP_NAIAD_TOKEN }}
          VERSION_REF: ${{ github.ref_name }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::APP_NAIAD_TOKEN is empty — skipping add-on bump. Add a fine-grained PAT with contents:write on Neffez/app-naiad as an Actions secret named APP_NAIAD_TOKEN in THIS (naiad) repo, then re-run this job or push a new tag."
            exit 0
          fi
          echo "APP_NAIAD_TOKEN detected — bumping add-on version."
          VERSION="${VERSION_REF#v}"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Neffez/app-naiad.git" addon
          cd addon
          sed -i "s/^version: .*/version: \"${VERSION}\"/" naiad/config.yaml
          if git diff --quiet -- naiad/config.yaml; then
            echo "Add-on config.yaml already at ${VERSION}; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump add-on to ${VERSION} (naiad ${VERSION_REF})"
          git push
          echo "Pushed add-on version ${VERSION}."
