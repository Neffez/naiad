# Optional first-boot seed. config.yaml is not required: without it Naiad starts
# empty and is configured entirely in the UI. If this file is present on the
# first start (empty database), Naiad imports it once; afterwards the database is
# the source of truth and the configuration is edited in the UI (Settings ->
# System configuration), with Export/Import for backup.
# Secrets (HA token, password) come from the environment only — never hardcoded.

ha:
  url: ws://homeassistant.local:8123/api/websocket
  token: ${HA_TOKEN}  # read from environment
  # Each notify target picks which categories it receives and how. A plain string
  # (just the service) is also accepted and means "all categories".
  notify_targets:
    - service: notify.mobile_app_pixel
      categories: [start, skip, abort, reminder]   # which kinds this phone wants
      quiet: false                                  # silent / low-priority delivery
      platform: auto                                # auto | ios | android (tunes quiet)
    # - service: notify.mobile_app_iphone
    #   categories: [reminder]                      # e.g. only the evening reminder
    #   platform: ios

# Optional: mirror tracked liters and run durations into Home Assistant as MQTT
# sensors (via MQTT discovery). HA then keeps long-term statistics for them and —
# through its InfluxDB integration — forwards the state changes to InfluxDB/Grafana.
# Also exposes control entities (master switch, start/stop buttons per sequence,
# manual adjustment factor) so Naiad can be driven from HA automations and voice
# assistants. Note: anyone with broker access can use these controls — secure the
# broker accordingly. Requires an MQTT broker (e.g. the Mosquitto add-on).
# Disabled by default.
mqtt:
  enabled: false
  host: core-mosquitto        # broker hostname (the Mosquitto add-on inside HA)
  port: 1883
  username: naiad
  # The password is environment-managed: it is stripped before the config is
  # persisted and re-injected from ${MQTT_PASSWORD} on load. A literal value here
  # is NOT durable — always provide it via the environment.
  password: ${MQTT_PASSWORD}
  client_id: naiad
  discovery_prefix: homeassistant   # HA's MQTT discovery prefix (default)
  base_topic: naiad                 # root for Naiad's own state/availability topics

auth:
  mode: password  # password | forward_header | none
  # Shared app password — environment-managed only. It is stripped before the
  # config is persisted to the database and re-injected from the environment on
  # load, so a literal value here is NOT durable: it works on first boot but is
  # lost on the next restart. Always provide it via ${NAIAD_PASSWORD_HASH}
  # (a bcrypt hash, $2b$...). With mode=password and no password set, the API
  # rejects the change / login (503) to avoid locking you out.
  password: ${NAIAD_PASSWORD_HASH}
  # Used only when mode = forward_header: trust an authenticated user asserted by
  # a reverse proxy (e.g. Authelia/Authentik) via a request header.
  forward_header:
    header: X-Forwarded-User
    trusted_proxies: []  # optional: only accept the header from these proxy IPs
  auto_login:
    enabled: false
    trigger:
      url_param: embed
      trusted_referers:
        - "http://homeassistant.local:8123"
      trusted_ips: []  # optional: ["192.168.178.50/32"]
  # HA add-on ingress trust: requests proxied by the Supervisor ingress are already
  # authenticated by Home Assistant, so the sidebar needs no Naiad login. This is
  # additive — it coexists with `mode`, so the direct port still requires a password.
  # Inert outside the add-on (the trusted source IP never matches).
  ingress:
    enabled: true
    trusted_ip: "172.30.32.2"  # the Supervisor's fixed internal ingress IP
  frame_ancestors:
    - "'self'"
    - "http://homeassistant.local:8123"

sensors:
  rain: binary_sensor.regen
  wind: binary_sensor.windalarm
  season: binary_sensor.jahreszeit
  temperature: sensor.nordfassade_temperatur
  # Optional: forecast of the day's maximum temperature. When set, the temperature
  # adjustment uses this peak instead of the current temperature, so a run
  # scheduled at night still scales to the (warmer) daytime maximum. When unset,
  # Naiad falls back to YESTERDAY's recorded max (from the `temperature` sensor's
  # history); the current temperature is only used as a last resort.
  # temperature_max: sensor.forecast_temperature_max_today
  precipitation_prob_today: sensor.precipitation_probability_today
  precipitation_prob_tomorrow: sensor.precipitation_probability_tomorrow
  precipitation_today: sensor.precipitation_today
  precipitation_tomorrow: sensor.precipitation_tomorrow
  # Optional actual precipitation amount in mm. Used by rain.mode=water_balance
  # to keep recent real rain as a decaying credit across scheduled runs. If this
  # comes from a forecast/weather integration rather than a physical rain gauge,
  # enable rain.confirm_with_rain_sensor so only rain confirmed by sensors.rain counts.
  # precipitation_actual: sensor.precipitation_actual
  # Optional daily reference evapotranspiration (ET₀) in mm/day, e.g. from the
  # HA "Smart Irrigation" integration. Used by rain.mode=et0; when unset, Naiad
  # computes ET₀ internally (Hargreaves) from the temperature sensor's daily
  # min/max history and the Home Assistant home latitude.
  # et0: sensor.smart_irrigation_evapotranspiration

# Optional frost lockout: while the forecast daily minimum temperature is below
# the threshold, automatic runs (schedule, plans, MQTT) are skipped — protects
# pipes and sprinklers in the shoulder seasons. Manual starts are not affected;
# an unreadable sensor never blocks watering.
# frost:
#   enabled: true
#   temperature_min: sensor.forecast_temperature_min_today
#   threshold_c: 3.0

# Optional cistern guard: while the level sensor reads below the minimum,
# automatic runs are skipped (dry-run protection for the pump). min_level uses
# the sensor's own unit (e.g. % or cm). Manual starts are not affected.
# cistern:
#   enabled: true
#   level_entity: sensor.cistern_level
#   min_level: 20

# Water price per cubic meter (e.g. EUR/m³): turns the tracked liters into a
# cost display on the dashboard and history. 0 (default) hides it.
# water_price_per_m3: 4.50

zones:
  example_zone:
    label: "Example Zone"
    switch: switch.bewaesserung_example
    flow_lph: 500
    # Optional: if the actuator has a hardware staircase-light timer that closes
    # the valve on its own, enable it and set the actuator's configured on-time.
    # Naiad re-sends "on" before it expires to keep the valve open, while the
    # timer remains a hardware safety net against a stuck-open valve.
    # staircase_enabled: true
    # staircase_min: 20

sequences:
  example:
    label: "Example Sequence"
    zones: [example_zone]
    basis_min_per_zone: 30
    range: [10, 60]
    # Safety timeout for a SINGLE zone (not the whole run): a zone that stays on
    # longer than this is forced off and the run aborts. Keep it above the
    # per-zone duration; a run of N zones can take up to N x watchdog_min.
    watchdog_min: 60
    schedule:
      # Clock times on selected weekdays — the form the UI edits. ISO weekdays
      # 1=Mon … 7=Sun; empty `days` means every day. One trigger is registered
      # per time. For expressions the picker can't represent (e.g. intervals),
      # set `cron:` instead — it overrides days/times. Legacy `cron: "0 6 * * *"`
      # is still accepted and migrated automatically.
      days: []           # every day
      times: ["06:00"]
    enabled: false
    wind_blocks: false

factors:
  temp:
    formula: linear
    basis_c: 20
    pct_per_c: 7
    min_pct: 80
    max_pct: 150
  rain:
    mode: forecast            # forecast | water_balance | et0
    forecast_days: 2
    threshold_prob: 70        # % — below this, rain factor = 1.0
    reduce_above_mm: 5.0      # mm — linear reduction starts here
    zero_above_mm: 20.0       # mm — factor = 0.0 at or above this
    forecast_decay: 0.5       # tomorrow's values multiplied by this
    water_balance_days: 4     # water_balance/et0: recent actual-rain window
    water_balance_decay: 0.65 # water_balance: daily carryover of actual rain
                              # (et0: per-day fallback when no ET₀ data exists)
    et0_reservoir_mm: 25.0    # et0: soil reservoir in mm of plant-available water
                              # (field capacity of the root zone). Rain fills the
                              # ET₀ balance up to this cap; daily ET₀ drains it.
    peak_tomorrow: false      # true = also use tomorrow's daily peak forecast,
                              # not just the latest reading (today always uses the peak)
    confirm_with_rain_sensor: false  # true = today's peak only counts up to the level
                              # that coincided with the binary rain sensor (sensors.rain)
                              # actually detecting rain; otherwise today uses the latest
                              # reading, so a forecast spike that never produced real rain
                              # does not suppress watering. Opt-in; affects today only.

notifications:
  # When the nightly reminder fires (who receives it is per-target, via the
  # "reminder" category on each notify target above).
  evening_reminder_cron: "0 21 * * *"
  # If Home Assistant is briefly unreachable when a notification is sent, it is
  # queued and re-delivered on reconnect. Entries older than this many hours are
  # dropped instead of arriving late. Set to 0 to disable queuing.
  queue_max_hours: 6
