ha:
  url: ws://homeassistant.local:8123/api/websocket
  token: ${HA_TOKEN}  # read from environment
  notify_targets:
    - notify.mobile_app_pixel
    # - notify.mobile_app_iphone

auth:
  mode: password  # password | forward_header | none
  # Used only when mode = forward_header: trust an authenticated user asserted by
  # a reverse proxy (e.g. Authelia/Authentik) via a request header.
  forward_header:
    header: X-Forwarded-User
    trusted_proxies: []  # optional: only accept the header from these proxy IPs
  auto_login:
    enabled: false
    trigger:
      url_param: embed
      trusted_referers:
        - "http://homeassistant.local:8123"
      trusted_ips: []  # optional: ["192.168.178.50/32"]
  frame_ancestors:
    - "'self'"
    - "http://homeassistant.local:8123"

sensors:
  rain: binary_sensor.regen
  wind: binary_sensor.windalarm
  season: binary_sensor.jahreszeit
  temperature: sensor.nordfassade_temperatur
  precipitation_prob_today: sensor.precipitation_probability_today
  precipitation_prob_tomorrow: sensor.precipitation_probability_tomorrow
  precipitation_today: sensor.precipitation_today
  precipitation_tomorrow: sensor.precipitation_tomorrow

zones:
  example_zone:
    label: "Example Zone"
    switch: switch.bewaesserung_example
    flow_lph: 500

sequences:
  example:
    label: "Example Sequence"
    zones: [example_zone]
    basis_min_per_zone: 30
    range: [10, 60]
    watchdog_min: 60
    schedule:
      cron: "0 6 * * *"  # daily 06:00
    enabled: false
    wind_blocks: false

factors:
  temp:
    formula: linear
    basis_c: 20
    pct_per_c: 7
    min_pct: 80
    max_pct: 150
  rain:
    forecast_days: 2
    threshold_prob: 70        # % — below this, rain factor = 1.0
    reduce_above_mm: 5.0      # mm — linear reduction starts here
    zero_above_mm: 20.0       # mm — factor = 0.0 at or above this
    forecast_decay: 0.5       # tomorrow's values multiplied by this
